name: refresh-data

# data.json(회의록 정적 사본) 자동 재발행.
# 앱은 data.json을 먼저 읽고, 클라우드에서 그보다 새로 저장된 회의록만 개별로 받아오므로
# 매일 한 번 재발행해 두면 회의록이 10년치로 늘어도 평소 클라우드 호출은 목록 1회 + 최근 변경분 몇 건에 그친다.
on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-data.yml"
      - "scripts/build-data.mjs"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build data.json from cloud
        run: node scripts/build-data.mjs
      - name: Commit if changed
        run: |
          git add data-*.json system-backup.json data-health.json
          if git diff --cached --quiet; then
            echo "정적 사본 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "정적 사본(data-*.json·system-backup.json) 자동 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
