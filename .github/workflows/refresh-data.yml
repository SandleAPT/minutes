name: refresh-data

# data.json(회의록 정적 사본) 자동 재발행.
# 앱은 data.json을 먼저 읽고, 클라우드에서 그보다 새로 저장된 회의록만 개별로 받아오므로
# 매일 한 번 재발행해 두면 회의록이 10년치로 늘어도 평소 클라우드 호출은 목록 1회 + 최근 변경분 몇 건에 그친다.
on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 KST
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-data.yml"
      - "scripts/build-data.mjs"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build data.json from cloud
        run: node scripts/build-data.mjs
      - name: Commit if changed
        run: |
          git add data-*.json system-backup.json data-health.json
          if git diff --cached --quiet; then
            echo "정적 사본 변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "정적 사본(data-*.json·system-backup.json) 자동 갱신 ($(date -u +%Y-%m-%dT%H:%MZ))"
          # 이 작업은 클라우드에서 239건을 순차로 받느라 10~15분 걸린다.
          # 그 사이 사람이 한 번만 push해도 예전에는 마지막 push가 거부돼 통째로 실패했다
          # (2026-09-01 run #29). 사본은 생성 결과만 담고 있어 남의 커밋 위에 그대로 얹으면 된다.
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push 재시도 $i (그 사이 새 커밋이 올라온 듯)"
            sleep 5
          done
          echo "3회 시도 후에도 push 실패"
          exit 1
